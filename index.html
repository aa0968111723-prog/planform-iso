<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#eef2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="平面場 ISO — 快速製作活動場刊圖、場佈圖與動線圖，讓夥伴清楚知道東西放哪裡、人怎麼走、自己負責哪裡" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>平面場 ISO · 活動場佈</title>
    <script>
      // Stamp the stored look before the first paint so a dark-mode user never
      // sees a white flash (and a light-mode user never sees a dark one).
      try {
        var t = localStorage.getItem("planform.theme");
        if (t !== "light" && t !== "dark") t = "light";
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.style.colorScheme = t;
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    </script>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
