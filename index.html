<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#eef2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="PLANFORM — 活動開始前，把場地、3D 道具、人流與互動先排好、先彩排，再把清楚的場刊圖交給夥伴。" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>PLANFORM｜活動空間彩排</title>
    <script>
      // Stamp the stored look before the first paint so a dark-mode user never
      // sees a white flash (and a light-mode user never sees a dark one).
      try {
        var t = localStorage.getItem("planform.theme");
        if (t !== "light" && t !== "dark") t = "light";
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.style.colorScheme = t;
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    </script>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
